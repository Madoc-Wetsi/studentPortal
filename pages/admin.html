<!doctype html>

  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

          <a href="#" id="teachers"

          <a href="#" id="classes"><i class="fa fa-school"></i> Classes</a>
          <a href="#" id="attendance"
            ><i class="fa fa-calendar-check"></i> Attendance</a
          >
          <a href="#" id="examinations"
            ><i class="fa fa-file-alt"></i> Examinations</a
          >
          <a href="#" id="fees"
            ><i class="fa fa-money-bill"></i> Fees & Payments</a
          >
          <a href="#" id="library"><i class="fa fa-book"></i> Library</a>
          <a href="#" id="transport"><i class="fa fa-bus"></i> Transport</a>

          <a href="#" id="assignments"

          <a href="#" id="grades"><i class="fa fa-chart-bar"></i> Grades</a>
          <p>SYSTEM</p>
          <a href="#" id="announcements"
            ><i class="fa fa-bell"></i> Announcements</a

          <a href="#" id="calendar"><i class="fa fa-calendar"></i> Calendar</a>
          <a href="#" id="messages"><i class="fa fa-envelope"></i> Messages</a>
          <a href="#" id="profile"><i class="fa fa-user"></i> Profile</a>

          <a href="#" class="navfooter"
            ><i class="fa fa-sign-out-alt"></i> Logout</a
          >
        </nav>
      </div>
      <div class="in">
        <header>
          <div>
            <i class="fa fa-bars"></i>
          </div>

          <div>
            <i class="fa fa-message"></i>
            <i fa fa-alert></i>
          </div>
        </header>

        <div class="showpages">
          <section id="dashboard1">
            <!-- Display Area -->
            <div class="dashboard">
              <!-- Top Metrics -->
              <div class="metrics">
                <div class="metric-box"></div>
                <div class="metric-box"></div>
                <div class="metric-box"></div>
                <div class="metric-box"></div>
              </div>

              <!-- Attendance Overview + Calendar -->
              <div class="attendance-calendar">
                <div class="attendance-graph"></div>
                <div class="calendar"></div>
              </div>

              <!-- Student Distribution + Fee Collection -->
              <div class="distribution-fees">
                <div class="student-distribution"></div>
                <div class="fee-collection"></div>
              </div>

              <!-- Announcements + Upcoming Events -->
              <div class="announcements-events">
                <div class="announcements"></div>
                <div class="upcoming-events"></div>
              </div>

              <!-- Quick Actions -->
              <div class="quick-actions">
                <div class="action-btn"></div>
                <div class="action-btn"></div>
                <div class="action-btn"></div>
                <div class="action-btn"></div>
